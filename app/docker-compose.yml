services:
  web:
    build: .
    container_name: intranet-container
    volumes:
      
      - ./db.sqlite3:/app/db.sqlite3
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "python manage.py migrate && 
             python manage.py loaddata inicial.json && 
             python manage.py runserver 0.0.0.0:8000"