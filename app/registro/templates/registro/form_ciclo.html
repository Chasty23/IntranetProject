{% extends "base.html" %}

{% block title %}
Nuevo ciclo
{% endblock title %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    Nuevo ciclo academico
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.nombre.id_for_label }}" class="form-label">Nombre</label>
                            {{ form.nombre }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.fecha_inicio.id_for_label }}" class="form-label">Fecha inicio</label>
                            {{ form.fecha_inicio }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.fecha_fin.id_for_label }}" class="form-label">Fecha fin</label>
                            {{ form.fecha_fin }}
                        </div>
                        <div class="form-check mb-3">
                            {{ form.activo }}
                            <label for="{{ form.activo.id_for_label }}" class="form-check-label">Activo</label>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'lista_ciclos_registro' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
