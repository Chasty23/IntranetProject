{% extends "base.html" %}

{% block title %}
Nueva Inscripción
{% endblock title %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header table-header-color text-white card-heading-padding">
                    <h5 class="mb-0">Inscribir Materia</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="materia" class="form-label">Materia</label>
                            <select name="materia" class="form-select" id="materia" required>
                                <option value="">-- Seleccionar materia --</option>
                                {% for m in materias %}
                                    <option value="{{ m.id }}">{{ m.codigo }} - {{ m.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="ciclo" class="form-label">Ciclo Académico</label>
                            <select name="ciclo" class="form-select" id="ciclo" required>
                                <option value="">-- Seleccionar ciclo --</option>
                                {% for c in ciclos %}
                                    <option value="{{ c.id }}">{{ c.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'lista_inscripciones' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Inscribir</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
