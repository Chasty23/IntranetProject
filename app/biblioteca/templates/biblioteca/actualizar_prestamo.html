{% extends "base.html" %}

{% block title %}
Actualizar prestamo
{% endblock title %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    Actualizar estado de prestamo
                </div>
                <div class="card-body">
                    <h5>{{ prestamo.libro.titulo }}</h5>
                    <p class="text-muted">{{ prestamo.expediente.carnet }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select name="estado" id="estado" class="form-select">
                                {% for codigo, nombre in estados %}
                                <option value="{{ codigo }}" {% if prestamo.estado == codigo %}selected{% endif %}>{{ nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'detalle_prestamo_biblioteca' prestamo.id %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
