{% extends "base.html" %}

{% block title %}
Nuevo prestamo
{% endblock title %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    Nuevo prestamo
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {% if form.expediente %}
                        <div class="mb-3">
                            <label for="{{ form.expediente.id_for_label }}" class="form-label">Expediente</label>
                            {{ form.expediente }}
                        </div>
                        {% endif %}
                        <div class="mb-3">
                            <label for="{{ form.libro.id_for_label }}" class="form-label">Libro</label>
                            {{ form.libro }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.fecha_prestamo.id_for_label }}" class="form-label">Fecha prestamo</label>
                            {{ form.fecha_prestamo }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.fecha_devolucion.id_for_label }}" class="form-label">Fecha devolucion</label>
                            {{ form.fecha_devolucion }}
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'lista_prestamos_biblioteca' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
