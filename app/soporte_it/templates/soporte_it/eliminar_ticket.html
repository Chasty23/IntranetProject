{% extends "base.html" %}

{% block title %}
Eliminar ticket
{% endblock title %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    Eliminar ticket
                </div>
                <div class="card-body">
                    <p>Estas seguro que deseas eliminar el ticket <strong>{{ ticket.titulo }}</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'detalle_ticket_soporte' ticket.id %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-danger">Eliminar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
