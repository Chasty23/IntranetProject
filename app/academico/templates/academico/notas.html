<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Modulo academico</title>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3>Módulo Académico - UTEC</h3>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Carnet</th>
                            <th>Estudiante</th>
                            <th>Materia</th>
                            <th>Nota</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for n in notas %}
                        <tr>
                            <td>{{ n.estudiante.carnet }}</td>
                            <td>{{ n.estudiante.usuario.get_full_name }}</td>
                            <td>{{ n.materia.nombre }}</td>
                            <td><strong>{{ n.calificacion }}</strong></td>
                            <td>
                                {% if perms.academico.puede_modificar_notas %}
                                <a href="{% url 'editar_nota' n.id %}" class="btn btn-sm btn-warning">Editar</a>
                                {% else %}
                                <span class="badge bg-secondary">Solo Lectura</span>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
