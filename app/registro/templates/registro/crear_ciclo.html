{% extends "base.html" %}

{% block title %}
Crear Ciclo Académico
{% endblock title %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header table-header-color text-white card-heading-padding">
                    <h5 class="mb-0">Crear Nuevo Ciclo Académico</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Ciclo</label>
                            <input type="text" name="nombre" class="form-control" id="nombre" placeholder="Ej: Ciclo 01-2026" required>
                        </div>
                        <div class="mb-3">
                            <label for="fecha_inicio" class="form-label">Fecha de Inicio</label>
                            <input type="date" name="fecha_inicio" class="form-control" id="fecha_inicio" required>
                        </div>
                        <div class="mb-3">
                            <label for="fecha_fin" class="form-label">Fecha de Fin</label>
                            <input type="date" name="fecha_fin" class="form-control" id="fecha_fin" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="activo" class="form-check-input" id="activo" checked>
                            <label class="form-check-label" for="activo">Ciclo Activo</label>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'lista_ciclos' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Crear Ciclo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
