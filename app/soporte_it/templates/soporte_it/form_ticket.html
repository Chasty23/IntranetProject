{% extends "base.html" %}

{% block title %}
{{ titulo_pagina }}
{% endblock title %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    {{ titulo_pagina }}
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.titulo.id_for_label }}" class="form-label">Titulo</label>
                            {{ form.titulo }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.descripcion.id_for_label }}" class="form-label">Descripcion</label>
                            {{ form.descripcion }}
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'lista_tickets_soporte' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
