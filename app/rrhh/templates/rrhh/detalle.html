<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-info shadow">
                <div class="card-header bg-info text-white d-flex justify-content-between">
                    <h4 class="mb-0">Expediente de Empleado</h4>
                    <span class="badge bg-light text-dark">ID: {{ empleado.id }}</span>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 text-center">
                            <i class="bi bi-person-bounding-box display-1 text-secondary"></i>
                        </div>
                        <div class="col-md-8">
                            <h3>{{ empleado.nombre }}</h3>
                            <p class="text-muted">{{ empleado.puesto }}</p>
                            <hr>
                            <p><strong>DUI:</strong> {{ empleado.dui }}</p>
                            <p><strong>Fecha de Ingreso:</strong> {{ empleado.fecha_contratacion }}</p>
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-end">
                        <a href="{% url 'lista_empleados' %}" class="btn btn-outline-secondary">Regresar al Listado</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
